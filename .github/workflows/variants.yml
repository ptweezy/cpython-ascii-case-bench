name: variants

# Builds of main plus several variants of the change (patches in
# variants/), checked and then timed side by side on each runner.  Build
# types as in bench.yml: release, pgo (plus LTO on Linux and macOS) or
# novec (Linux and macOS only).  The benchmark set is short (focused on
# short strings) or full.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: patch names in variants/, without .patch
        default: "varA varC varD"
      runners:
        description: JSON list of runner labels
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "windows-11-arm", "macos-15", "macos-15-intel"]'
      build:
        description: release, pgo or novec
        default: release
      bench_set:
        description: short or full
        default: short
      reps:
        description: JSON list of job numbers per runner (each job may get a different CPU)
        default: '[1, 2]'
      replay_rounds:
        description: rounds of the real-world replay
        default: '5'

permissions:
  contents: read

env:
  CPYTHON_BASE: 4e0677ac610d9e890503fc0c0ca8351bfdd5f000

jobs:
  bench:
    name: ${{ matrix.os }} / ${{ inputs.build || 'release' }} / run ${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(inputs.reps || '[1, 2]') }}
    env:
      BENCH_RUNNER: ${{ matrix.os }}
      BENCH_BUILD: ${{ inputs.build || 'release' }}
      BENCH_REP: ${{ matrix.rep }}
      BENCH_PROCS: "10"
      BENCH_SET: ${{ inputs.bench_set || 'short' }}
      VARIANTS: ${{ inputs.variants || 'varA varC varD' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: ${{ env.CPYTHON_BASE }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Make variant trees
        shell: bash
        # A worktree checks out symlinks the same way as base (cp -r can't
        # recreate some of them on the Windows ARM64 image).
        run: |
          for v in $VARIANTS; do
            git -C base worktree add -q --detach ../$v HEAD
            git -C $v apply --cached ../harness/variants/$v.patch
            git -C $v checkout -- .
            git -C $v diff --cached --stat
          done

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=(-q)
          if [ "$BENCH_BUILD" = pgo ]; then args+=(--enable-optimizations --with-lto); fi
          if [ "$BENCH_BUILD" = novec ]; then
            if [ "$RUNNER_OS" = macOS ]; then args+=("CFLAGS=-fno-vectorize -fno-slp-vectorize")
            else args+=("CFLAGS=-fno-tree-vectorize"); fi
          fi
          echo "configure ${args[*]}"
          jobs=$(getconf _NPROCESSORS_ONLN)
          for t in base $VARIANTS; do
            if ! (cd $t && ./configure "${args[@]}" > ../configure-$t.log 2>&1 && make -j$jobs > ../make-$t.log 2>&1); then
              tail -n 60 configure-$t.log make-$t.log; exit 1
            fi
            echo "built $t"
          done

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plat = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'x64' }
          $opts = @()
          if ($env:BENCH_BUILD -eq 'pgo') { $opts += '--pgo' }
          foreach ($t in @('base') + $env:VARIANTS.Split(' ')) {
            & "$t\PCbuild\build.bat" -p $plat -c Release --no-tkinter @opts *> "build-$t.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "build-$t.log" -Tail 60; exit 1 }
            "built $t"
          }

      - name: Check each variant
        shell: bash
        run: |
          for v in $VARIANTS; do
            P=$(python harness/bench.py --which $v)
            echo "== $v: $("$P" -c 'import sys; print(sys.version)')"
            "$P" -I harness/edge_cases.py
            "$P" -I harness/check_all.py
            "$P" -m test test_str test_bytes test_userstring test_string -j0 2>&1 | tail -n 4
          done

      - name: Benchmark
        shell: bash
        run: |
          python -m pip install --quiet --no-deps --target pyperf-lib pyperf==2.10.0
          specs="base=base"
          for v in $VARIANTS; do specs="$specs $v=$v"; done
          python harness/bench.py --multi results pyperf-lib $specs

      - name: Real-world replay
        shell: bash
        # The lower() length mix of each realworld/hist workload, shuffled
        # (see realworld/README.md); builds alternate over replay_rounds
        # rounds, each run pinned to logical CPU 1.
        env:
          REPLAY_CPU: "1"
          ROUNDS: ${{ inputs.replay_rounds || '5' }}
        run: |
          specs="base=$(python harness/bench.py --which base)"
          for v in $VARIANTS; do specs="$specs $v=$(python harness/bench.py --which $v)"; done
          python harness/realworld/replay_drive.py harness/realworld/hist results/replay $ROUNDS $specs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variants-${{ matrix.os }}-${{ inputs.build || 'release' }}-${{ matrix.rep }}
          path: |
            results/
            *.log
          if-no-files-found: warn
