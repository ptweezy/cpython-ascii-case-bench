name: layout

# Code placement alone moves the short-string replay by several percent
# (identical code a few bytes apart), more than the differences between
# variants.  Here each build of main and the variants is relinked once per
# shift with a padding object of that many bytes ahead of all of Python's
# own code, so every function moves and the code stays the same.  The
# replay then runs over every (build, shift) pair, and variants are
# compared by their mean over shifts (realworld/layout_summary.py).  Linux
# and macOS only: the relink edits the python link line from the Makefile.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: patch names in variants/, without .patch
        default: "varJ varV varW varX"
      runners:
        description: JSON list of runner labels (Linux and macOS)
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel"]'
      build:
        description: release, o2 (CFLAGS=-O2, after configure's -O3, as distributions build) or pgo (--enable-optimizations --with-lto)
        default: release
      reps:
        description: JSON list of job numbers per runner (each job may get a different CPU)
        default: '[1, 2]'
      pads:
        description: shifts in bytes, multiples of 16 (the default covers each 16-byte offset in a 64-byte line twice)
        default: "0 16 32 48 1024 2064 3104 4080"
      rounds:
        description: replay rounds
        default: '5'
      cc:
        description: compiler (CC), e.g. gcc-14; empty for the runner's default
        default: ""
      cflags:
        description: CFLAGS given to configure (they follow OPT's -O3), e.g. -O2 as Docker's python images append from dpkg-buildflags; overrides the o2 build's -O2
        default: ""
      profile_task:
        description: PROFILE_TASK for pgo builds; empty for CPython's default training
        default: ""
      container:
        description: Fedora image to run the job in, e.g. fedora:44 for its gcc; empty to run on the runner
        default: ""
      keep_binaries:
        description: also upload each tree's python binary (to compare code between builds)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CPYTHON_BASE: 4e0677ac610d9e890503fc0c0ca8351bfdd5f000

jobs:
  layout:
    name: ${{ matrix.os }} ${{ inputs.container }} / ${{ inputs.build || 'release' }} ${{ inputs.cc }} ${{ inputs.cflags }} ${{ inputs.profile_task && 'custom training' || '' }} / run ${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    container: ${{ inputs.container || null }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(inputs.reps || '[1, 2]') }}
    env:
      BENCH_RUNNER: ${{ matrix.os }}
      BENCH_BUILD: ${{ inputs.build || 'release' }}
      BENCH_REP: ${{ matrix.rep }}
      VARIANTS: ${{ inputs.variants || 'varJ varV varW varX' }}
      PADS: ${{ inputs.pads || '0 16 32 48 1024 2064 3104 4080' }}
      BENCH_CC: ${{ inputs.cc }}
      BENCH_CFLAGS: ${{ inputs.cflags }}
      BENCH_PROFILE_TASK: ${{ inputs.profile_task }}
      BENCH_CONTAINER: ${{ inputs.container }}
    steps:
      - name: Install build tools in the container
        if: inputs.container != ''
        shell: bash
        run: |
          # Before checkout, so that it makes git clones (the variant trees
          # are git worktrees of base).
          dnf -y -q install --skip-unavailable git gcc make binutils python3 gawk sed grep \
            findutils diffutils which procps-ng util-linux libffi-devel openssl-devel \
            zlib-ng-compat-devel bzip2-devel xz-devel sqlite-devel readline-devel \
            ncurses-devel gdbm-devel libuuid-devel expat-devel
          git config --global --add safe.directory '*'
          gcc --version | head -n 1
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: ${{ env.CPYTHON_BASE }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: setup-python
        if: inputs.container == ''
        continue-on-error: true  # new runner images may lack a prebuilt 3.13
        with:
          python-version: "3.13"
      - name: Fall back to the system python3
        if: steps.setup-python.outcome != 'success'
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v python3)" "$HOME/bin/python"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          python3 --version

      - name: Make variant trees
        shell: bash
        run: |
          for v in $VARIANTS; do
            git -C base worktree add -q --detach ../$v HEAD
            git -C $v apply --cached ../harness/variants/$v.patch
            git -C $v checkout -- .
            git -C $v diff --cached --stat
          done

      - name: Build
        shell: bash
        run: |
          args=(-q)
          if [ "$BENCH_BUILD" = o2 ]; then args+=("CFLAGS=-O2"); fi
          if [ "$BENCH_BUILD" = pgo ]; then args+=(--enable-optimizations --with-lto); fi
          if [ -n "$BENCH_CC" ]; then args+=("CC=$BENCH_CC"); "$BENCH_CC" --version | head -n 1; fi
          # clang's PGO and LTO need llvm-profdata and llvm-ar, which Ubuntu
          # keeps next to clang in /usr/lib/llvm-N/bin.
          ccdir=$(dirname "$(readlink -f "$(command -v "${BENCH_CC:-cc}")")")
          if [ -x "$ccdir/llvm-ar" ]; then export PATH="$ccdir:$PATH"; echo "PATH += $ccdir"; fi
          if [ -n "$BENCH_CFLAGS" ]; then args+=("CFLAGS=$BENCH_CFLAGS"); fi
          mk=()
          if [ -n "$BENCH_PROFILE_TASK" ]; then mk+=("PROFILE_TASK=$BENCH_PROFILE_TASK"); fi
          echo "configure ${args[*]}"
          echo "make ${mk[*]}"
          jobs=$(getconf _NPROCESSORS_ONLN)
          for t in base $VARIANTS; do
            if ! (cd $t && ./configure "${args[@]}" > ../configure-$t.log 2>&1 && make -j$jobs "${mk[@]}" > ../make-$t.log 2>&1); then
              tail -n 60 configure-$t.log make-$t.log; exit 1
            fi
            echo "built $t"
          done

      - name: Count SIMD instructions in the case-conversion code
        shell: bash
        run: |
          # Whether the compiler vectorized each tree's loop: SSE/AVX
          # registers on x86, NEON vector registers on arm64.
          mkdir -p results
          for t in base $VARIANTS; do
            for f in ascii_case_words _Py_bytes_lower; do
              n=$(objdump -d --no-show-raw-insn $t/python 2>/dev/null \
                  | awk -v f="$f" '$0 ~ "^[0-9a-f]+ <_?" f "[.>]" {on=1; next} /^[0-9a-f]+ </ {on=0} on' \
                  | grep -cE '%[xy]mm|[^a-z0-9_]v[0-9]+\.|[^a-z0-9_]q[0-9]+([^0-9]|$)' || true)
              echo "$t $f $n"
            done
          done | tee results/simd.txt

      - name: Relink with each shift
        shell: bash
        run: |
          for p in $PADS; do
            if [ "$RUNNER_OS" = macOS ]; then
              printf '.text\n.space %d, 0x90\n' $p > pad$p.s
            else
              printf '.text\n.skip %d, 0x90\n.section .note.GNU-stack,"",@progbits\n' $p > pad$p.s
            fi
            cc -c pad$p.s -o pad$p.o
          done
          for t in base $VARIANTS; do
            addrs=""
            for p in $PADS; do
              cmd=$(cd $t && make -n python-pad$p BUILDPYTHON=python-pad$p | tail -n 1)
              # sed, not ${cmd/.../...}: bash 3.2 (macOS /bin/bash) mangles that here.
              new=$(printf '%s' "$cmd" | sed "s| -o python-pad$p Programs/python.o | -o python-pad$p $PWD/pad$p.o Programs/python.o |")
              if [ "$new" = "$cmd" ]; then echo "no link line for $t: $cmd"; exit 1; fi
              (cd $t && eval "$new")
              addrs="$addrs $(nm $t/python-pad$p | awk '/ _?ascii_case_words$/ {print $1}' | tail -c 6)"
            done
            echo "$t: ascii_case_words at$addrs"
          done

      - name: Check each variant at every shift
        shell: bash
        run: |
          for v in $VARIANTS; do
            for p in $PADS; do
              "$v/python-pad$p" -I harness/edge_cases.py > /dev/null
            done
            echo "== $v: $("$v/python-pad0" -I harness/check_all.py)"
          done

      - name: Replay over every build and shift
        shell: bash
        env:
          REPLAY_CPU: "1"
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          mkdir -p results
          python - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, "harness")
          import bench
          meta = {k: os.environ.get(v, "") for k, v in
                  (("runner", "BENCH_RUNNER"), ("build", "BENCH_BUILD"), ("rep", "BENCH_REP"), ("pads", "PADS"),
                   ("cc", "BENCH_CC"), ("cflags", "BENCH_CFLAGS"), ("profile_task", "BENCH_PROFILE_TASK"),
                   ("container", "BENCH_CONTAINER"))}
          meta["cpu"] = bench.cpu_model()
          meta["machine"] = __import__("platform").machine()
          for t in ["base"] + os.environ["VARIANTS"].split():
              out =subprocess.run([f"{t}/python-pad0", "-c", "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('CFLAGS'))"],
                                   capture_output=True, text=True).stdout.splitlines()
              meta[f"{t}_version"], meta[f"{t}_cflags"] = out[0], out[-1]
          json.dump(meta, open("results/meta.json", "w"), indent=2)
          print(json.dumps(meta, indent=2))
          EOF
          specs=""
          for t in base $VARIANTS; do
            for p in $PADS; do
              name=$t.p$p
              [ $t = base ] && name=main.p$p
              [ $name = main.p0 ] && name=base
              specs="$specs $name=$t/python-pad$p"
            done
          done
          python harness/realworld/replay_drive.py harness/realworld/hist results/layout $ROUNDS $specs > results/layout-drive.txt
          python harness/realworld/layout_summary.py results/layout/times.json | tee results/layout.md

      - name: Fixed lengths over every build and shift
        shell: bash
        env:
          REPLAY_CPU: "1"
        run: |
          lens=""
          for t in base $VARIANTS; do
            for p in $PADS; do
              name=$t.p$p
              [ $t = base ] && name=main.p$p
              lens="$lens $name=$t/python-pad$p"
            done
          done
          python harness/realworld/len_layout.py results/lengths.json 3 $lens
          python harness/realworld/len_layout_summary.py results/lengths.json | tee results/lengths.md

      - name: Control operations over every build and shift
        shell: bash
        env:
          REPLAY_CPU: "1"
        run: |
          # String operations that don't reach the case code: shows whether a
          # tree's build as a whole is faster or slower (PGO varies).
          specs=""
          for t in base $VARIANTS; do
            for p in $PADS; do
              name=$t.p$p
              [ $t = base ] && name=main.p$p
              specs="$specs $name=$t/python-pad$p"
            done
          done
          python harness/realworld/control.py results/control.json 3 $specs
          python harness/realworld/control.py --summary results/control.json | tee results/control.md

      - name: Pack the binaries
        if: inputs.keep_binaries
        shell: bash
        run: |
          mkdir -p binaries
          for t in base $VARIANTS; do cp $t/python-pad0 binaries/python-$t; done
          tar czf binaries.tar.gz binaries
          ls -l binaries.tar.gz

      - uses: actions/upload-artifact@v4
        if: inputs.keep_binaries
        with:
          name: binaries-${{ matrix.os }}-${{ inputs.build || 'release' }}-${{ matrix.rep }}
          path: binaries.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-${{ matrix.os }}-${{ inputs.build || 'release' }}-${{ matrix.rep }}
          path: |
            results/
            *.log
          if-no-files-found: warn
