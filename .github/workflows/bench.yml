name: bench

# Builds CPython main (the parent of the gh-161155 commit) twice, once
# unchanged and once with gh-161155.patch, checks the patched build, then
# times both with pyperf on the same runner.  Build types: release (plain
# ./configure or build.bat), pgo (PGO, plus LTO on Linux and macOS) and
# novec (release with the compiler's auto-vectorizer turned off, for both
# trees; Linux and macOS only, since MSVC doesn't vectorize this loop).

on:
  workflow_dispatch:
    inputs:
      procs:
        description: pyperf worker processes per benchmark
        default: "10"

permissions:
  contents: read

env:
  CPYTHON_BASE: 4e0677ac610d9e890503fc0c0ca8351bfdd5f000

jobs:
  bench:
    name: ${{ matrix.os }} / ${{ matrix.build }} / run ${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
        build: [release, pgo, novec]
        rep: [1, 2]
        exclude:
          - os: windows-2025
            build: novec
          - os: windows-11-arm
            build: novec
    env:
      BENCH_RUNNER: ${{ matrix.os }}
      BENCH_BUILD: ${{ matrix.build }}
      BENCH_REP: ${{ matrix.rep }}
      BENCH_PROCS: ${{ inputs.procs || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: ${{ env.CPYTHON_BASE }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: ${{ env.CPYTHON_BASE }}
          path: patched
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply the patch
        shell: bash
        # Apply to the index (always LF), then rewrite the working tree from it,
        # so Windows CRLF checkouts don't trip up the patch.
        run: |
          git -C patched apply --cached ../harness/gh-161155.patch
          git -C patched checkout -- .
          git -C patched diff --cached --stat

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=(-q)
          if [ "$BENCH_BUILD" = pgo ]; then args+=(--enable-optimizations --with-lto); fi
          if [ "$BENCH_BUILD" = novec ]; then
            if [ "$RUNNER_OS" = macOS ]; then args+=("CFLAGS=-fno-vectorize -fno-slp-vectorize")
            else args+=("CFLAGS=-fno-tree-vectorize"); fi
          fi
          echo "configure ${args[*]}"
          jobs=$(getconf _NPROCESSORS_ONLN)
          for t in base patched; do
            echo "::group::build $t ($BENCH_BUILD)"
            if ! (cd $t && ./configure "${args[@]}" > ../configure-$t.log 2>&1 && make -j$jobs > ../make-$t.log 2>&1); then
              tail -n 60 configure-$t.log make-$t.log; exit 1
            fi
            tail -n 5 make-$t.log
            echo "::endgroup::"
          done

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PLAT=x64
          if "%RUNNER_ARCH%"=="ARM64" set PLAT=ARM64
          set OPTS=
          if "%BENCH_BUILD%"=="pgo" set OPTS=--pgo
          call base\PCbuild\build.bat -p %PLAT% -c Release --no-tkinter %OPTS% > build-base.log 2>&1
          if errorlevel 1 (powershell -NoProfile -Command "Get-Content build-base.log -Tail 60" & exit /b 1)
          call patched\PCbuild\build.bat -p %PLAT% -c Release --no-tkinter %OPTS% > build-patched.log 2>&1
          if errorlevel 1 (powershell -NoProfile -Command "Get-Content build-patched.log -Tail 60" & exit /b 1)

      - name: Check the patched build
        shell: bash
        run: |
          PB=$(python harness/bench.py --which base)
          PP=$(python harness/bench.py --which patched)
          "$PB" -c "import sys; print('base:   ', sys.version)"
          "$PP" -c "import sys; print('patched:', sys.version)"
          "$PP" -c "import sysconfig; print('CFLAGS:', sysconfig.get_config_var('CFLAGS'))"
          "$PP" -I harness/edge_cases.py
          "$PP" -I harness/check_all.py
          "$PP" -m test test_str test_bytes test_userstring test_string -j0

      - name: Vectorization check
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: bash harness/vec_check.sh patched

      - name: Word checks (cc)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc --version | head -n 1
          for o in -O2 -O3; do cc $o -o wew harness/word_exhaustive_word.c && echo "cc $o: $(./wew)"; done
          for o in -O2 -O3; do cc $o -o gck harness/variants/gcheck_G.c && echo "cc $o: $(./gck)"; done

      - name: Word checks (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set VCARCH=x64
          if "%RUNNER_ARCH%"=="ARM64" set VCARCH=arm64
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" %VCARCH% > nul
          cl /nologo /O2 harness\word_exhaustive_word.c /Fewew.exe > nul && wew.exe
          cl /nologo /O2 harness\variants\gcheck_G.c /Fegck.exe > nul && gck.exe

      - name: Benchmark
        shell: bash
        run: |
          python -m pip install --quiet --no-deps --target pyperf-lib pyperf==2.10.0
          python harness/bench.py base patched results pyperf-lib

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.rep }}
          path: |
            results/
            *.log
          if-no-files-found: warn
