name: check

# Compile exact/check_exact.c against the word helpers of the PR
# (gh-161155.patch) and of the short-path variants (variants/varK, varL,
# varM), each copied verbatim from Objects/bytes_methods.c with the patch
# applied, and run it with each runner's compilers, for both word loops (the
# MSVC one and the other).  Ubuntu also cross-compiles for 32-bit x86,
# 32-bit ARM and big-endian s390x and PowerPC, run under QEMU.

on:
  workflow_dispatch:
  push:
    paths: ["exact/**", "gh-161155.patch", "variants/varK.patch", "variants/varL.patch",
            "variants/varM.patch", ".github/workflows/check.yml"]

permissions:
  contents: read

env:
  CPYTHON_BASE: 4e0677ac610d9e890503fc0c0ca8351bfdd5f000
  PATCHES: gh-161155 variants/varK variants/varL variants/varM

jobs:
  unix:
    name: ${{ matrix.os }} ${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # gcc-multilib and the cross compilers can't be installed together
        include:
          - {os: ubuntu-24.04, extra: m32}
          - {os: ubuntu-24.04, extra: cross}
          - {os: ubuntu-24.04-arm, extra: ''}
          - {os: macos-15, extra: ''}
          - {os: macos-15-intel, extra: ''}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Sources
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/python/cpython/$CPYTHON_BASE/Objects/bytes_methods.c" -o main.c
          for p in $PATCHES; do
            n=$(basename $p)
            mkdir -p src-$n/Objects && cp main.c src-$n/Objects/bytes_methods.c
            (cd src-$n && git apply --include=Objects/bytes_methods.c ../harness/$p.patch)
            python3 harness/exact/extract.py src-$n/Objects/bytes_methods.c harness/exact/h-$n.h
          done
      - name: 32-bit compiler
        if: matrix.extra == 'm32'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib
      - name: Cross compilers
        if: matrix.extra == 'cross'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-s390x-linux-gnu gcc-powerpc-linux-gnu \
               gcc-arm-linux-gnueabihf qemu-user
      - name: Check
        shell: bash
        working-directory: harness/exact
        run: |
          fail=0
          run() {  # label, then compiler command; runner prefix in $EMU
            if "${@:2}" -fno-strict-overflow -Wall -Wextra -Werror check_exact.c -o ce; then
              printf '%-10s %-46s ' "$n" "$1"; $EMU ./ce || fail=1
            else
              echo "$n $1: compile failed"; fail=1
            fi
          }
          for p in $PATCHES; do
            n=$(basename $p)
            cp h-$n.h pr_helpers.h
            for cc in gcc clang; do
              command -v $cc > /dev/null || continue
              for o in -O2 -O3; do
                for cw in 0 1; do
                  EMU= run "$cc $o ($($cc -dumpmachine))" $cc $o -DCHECK_COUNT_WORDS=$cw
                done
              done
            done
            if [ "${{ matrix.extra }}" = m32 ]; then
              for cw in 0 1; do
                EMU= run "gcc -O2 -m32" gcc -O2 -m32 -DCHECK_COUNT_WORDS=$cw
              done
            fi
            if [ "${{ matrix.extra }}" = cross ]; then
              for cw in 0 1; do
                EMU=qemu-s390x run "s390x-linux-gnu-gcc -O2 (big-endian)" \
                    s390x-linux-gnu-gcc -O2 -static -DCHECK_COUNT_WORDS=$cw
                EMU=qemu-ppc run "powerpc-linux-gnu-gcc -O2 (big-endian, 32-bit)" \
                    powerpc-linux-gnu-gcc -O2 -static -DCHECK_COUNT_WORDS=$cw
                EMU=qemu-arm run "arm-linux-gnueabihf-gcc -O2 (32-bit)" \
                    arm-linux-gnueabihf-gcc -O2 -static -DCHECK_COUNT_WORDS=$cw
              done
            fi
          done
          exit $fail

  windows:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64}
          - {os: windows-2025, arch: x86}
          - {os: windows-11-arm, arch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sources
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/python/cpython/$CPYTHON_BASE/Objects/bytes_methods.c" -o main.c
          for p in $PATCHES; do
            n=$(basename $p)
            mkdir -p src-$n/Objects && cp main.c src-$n/Objects/bytes_methods.c
            (cd src-$n && git apply --include=Objects/bytes_methods.c ../harness/$p.patch)
            python harness/exact/extract.py src-$n/Objects/bytes_methods.c harness/exact/h-$n.h
          done
      - name: Check
        shell: pwsh
        working-directory: harness\exact
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.arch }} > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] }
          }
          $fail = 0
          foreach ($p in $env:PATCHES.Split(' ')) {
            $n = Split-Path $p -Leaf
            Copy-Item -Force "h-$n.h" pr_helpers.h
            foreach ($o in @('/O2'), @('/O1', '/Oi')) {
              foreach ($cw in 'native', '0', '1') {
                $opts = [Collections.Generic.List[string]]::new([string[]]$o)
                if ($cw -ne 'native') { $opts.Add("/DCHECK_COUNT_WORDS=$cw") }
                cl /nologo /W3 /WX $opts check_exact.c /Fece.exe | Out-Null
                if ($LASTEXITCODE -ne 0) { "$n MSVC ${{ matrix.arch }} $o cw=${cw}: compile failed"; $fail = 1; continue }
                $r = & .\ce.exe
                "{0,-10} MSVC ${{ matrix.arch }} {1,-8} cw={2,-7} {3}" -f $n, ($o -join ' '), $cw, $r
                if ($LASTEXITCODE -ne 0) { $fail = 1 }
              }
            }
          }
          exit $fail
